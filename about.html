            <!-- أزرار الفلترة -->

            <!-- فلترة إضافية -->

                        <option value="مديرية الثقافة">مديرية الثقافة</option>
                        <option value="المركز الثقافي العربي">المركز الثقافي العربي</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <input type="date" id="dateFilter" class="form-control">
                </div>
            </div>

            <!-- شبكة الفعاليات -->
            <div class="row g-4" id="allEventsGrid"></div>
        </div>
    </section>

            {

                title: "ندوة الأدب السوري المعاصر",
                category: "ثقافة",
                date: "2026-05-29",

                description: "ندوة نقاشية حول تطور الأدب السوري المعاصر وإسهاماته في المشهد الثقافي العربي.",
                image: "https://images.unsplash.com/photo-1532012197267-da84d127e765?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80",
                featured: false
            }
        ];

        document.addEventListener('DOMContentLoaded', function() {
            const allEventsGrid = document.getElementById('allEventsGrid');
            const searchInput = document.getElementById('searchInput');
            const filterButtons = document.querySelectorAll('.filter-btn');
            const locationFilter = document.getElementById('locationFilter');
            const dateFilter = document.getElementById('dateFilter');
            
            let currentCategory = "الكل";
            let currentLocation = "";
            let currentDate = "";

            // التحقق من وجود بارامتر التصنيف في الرابط
            const urlParams = new URLSearchParams(window.location.search);
            const categoryParam = urlParams.get('category');
            if (categoryParam && ['موسيقى', 'رياضة', 'طعام', 'فنون', 'ثقافة'].includes(categoryParam)) {
                currentCategory = categoryParam;
                filterButtons.forEach(btn => {
                    if (btn.dataset.category === currentCategory) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }

            function renderEvents() {
                allEventsGrid.innerHTML = '';
                let filteredEvents = damascusEvents;

                // فلترة حسب التصنيف
                if (currentCategory !== "الكل") {
                    filteredEvents = filteredEvents.filter(e => e.category === currentCategory);
                }

                // فلترة حسب الموقع
                if (currentLocation) {
                    filteredEvents = filteredEvents.filter(e => e.location === currentLocation);
                }

                // فلترة حسب التاريخ
                if (currentDate) {
                    filteredEvents = filteredEvents.filter(e => e.date === currentDate);
                }

                // فلترة حسب البحث
                const query = searchInput.value.trim().toLowerCase();
                if (query) {
                    filteredEvents = filteredEvents.filter(e => 
                        e.title.toLowerCase().includes(query) || 
                        e.description.toLowerCase().includes(query) ||
                        e.location.toLowerCase().includes(query)
                    );
                }

                // عرض البطاقات
                if (filteredEvents.length === 0) {
                    allEventsGrid.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="fas fa-calendar-times fa-3x text-muted mb-3"></i>
                            <h4 class="text-muted">لا توجد فعاليات تطابق معايير البحث</h4>
                            <p class="text-muted">جرب تغيير كلمات البحث أو معايير الفلترة</p>
                        </div>
                    `;
                } else {
                    filteredEvents.forEach(event => {
                        const eventCard = createEventCardWithDetails(event);
                        allEventsGrid.innerHTML += eventCard;
                    });
                }
            }

            // إنشاء بطاقة فعالية مع زر التفاصيل فقط
            function createEventCardWithDetails(event) {
                const categoryColor = getCategoryColor(event.category);
                const formattedDate = formatDate(event.date);
                
                return `
                <div class="col-lg-4 col-md-6">
                    <div class="event-card">
                        <div class="event-image">
                            <img src="${event.image}" alt="${event.title}" class="img-fluid">
                            <span class="event-category" style="background: ${categoryColor}">${event.category}</span>
                        </div>
                        <div class="event-content">
                            <h3 class="event-title">${event.title}</h3>
                            <p class="event-description">${event.description}</p>
                            <div class="event-meta">
                                <span><i class="fas fa-calendar me-1"></i> ${formattedDate}</span>
                                <span><i class="fas fa-map-marker-alt me-1"></i> ${event.location}</span>
                            </div>
                            <div class="mt-3 text-center">
                                <a href="event.html" class="btn btn-primary">
                                    <i class="fas fa-info-circle me-1"></i>التفاصيل
                                </a>
                            </div>
                        </div>
                    </div>
                </div>`;
            }

            // تغيير الفئة عند الضغط على زر
            filterButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    currentCategory = btn.dataset.category;
                    filterButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderEvents();
                });
            });

            // فلترة الموقع
            locationFilter.addEventListener('change', () => {
                currentLocation = locationFilter.value;
                renderEvents();
            });

            // فلترة التاريخ
            dateFilter.addEventListener('change', () => {
                currentDate = dateFilter.value;
                renderEvents();
            });

            // البحث الحي أثناء الكتابة
            searchInput.addEventListener('input', renderEvents);

            // استدعاء الوظائف
            setupDarkMode();
            renderEvents();
        });

        // دالة تنسيق التاريخ
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('ar-EG', options);
        }

        // دالة لون التصنيف
        function getCategoryColor(category) {
            const colors = {
                "موسيقى": "#f72585",
                "رياضة": "#4cc9f0", 
                "طعام": "#f8961e",
                "فنون": "#7209b7",
                "ثقافة": "#4361ee"
            };
            return colors[category] || "#6c757d";
        }

        // الوضع الليلي
        function setupDarkMode() {
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = themeToggle.querySelector('i');
            
            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            }
            
            themeToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                
                if (document.body.classList.contains('dark-mode')) {
                    themeIcon.classList.remove('fa-moon');
                    themeIcon.classList.add('fa-sun');
                    localStorage.setItem('darkMode', 'true');
                } else {
                    themeIcon.classList.remove('fa-sun');
                    themeIcon.classList.add('fa-moon');
                    localStorage.setItem('darkMode', 'false');
                }
            });
        }
    </script>
